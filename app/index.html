    <title>ReviewDesk, accedi</title>
    <script>
      // Suppress Vite HMR WebSocket errors in AI Studio iframe environment
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('ws://') || e.message.includes('wss://'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (String(e.reason).includes('WebSocket') || String(e.reason?.message || '').includes('WebSocket'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
